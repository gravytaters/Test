<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etsy Listing Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #f45800;
      --orange-dark: #d44e00;
      --cream: #fdf7f2;
      --card-bg: #ffffff;
      --border: #e8e0d8;
      --text: #333333;
      --muted: #767676;
      --radius: 8px;
    }

    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--orange);
      color: #fff;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
    }
    header .logo-icon { font-size: 26px; }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
    header p  { font-size: 13px; opacity: .88; }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 24px;
    }

    /* ── Upload card ── */
    .upload-card {
      background: var(--card-bg);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 52px 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    .upload-card:hover, .upload-card.dragover {
      border-color: var(--orange);
      background: #fff8f4;
    }
    .upload-card input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .upload-icon { font-size: 48px; margin-bottom: 12px; }
    .upload-card h2 { font-size: 18px; margin-bottom: 6px; }
    .upload-card p  { color: var(--muted); font-size: 14px; }

    .preview-wrap {
      display: none;
      align-items: center;
      gap: 20px;
      justify-content: center;
      flex-direction: column;
    }
    .preview-wrap img {
      max-height: 220px;
      max-width: 100%;
      border-radius: var(--radius);
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
    }
    .preview-wrap .file-name { font-size: 14px; color: var(--muted); }

    /* ── Generate button ── */
    .btn-generate {
      display: block;
      margin: 24px auto 0;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 14px 48px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .btn-generate:hover { background: var(--orange-dark); }
    .btn-generate:active { transform: scale(.98); }
    .btn-generate:disabled { background: #ccc; cursor: not-allowed; }

    /* ── Spinner ── */
    .spinner-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 40px 0;
    }
    .spinner {
      width: 46px; height: 46px;
      border: 4px solid #f0e8e0;
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner-wrap p { color: var(--muted); font-size: 14px; }

    /* ── Results ── */
    #results { display: none; margin-top: 40px; }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    .listing-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 40px;
    }
    @media (max-width: 680px) { .listing-grid { grid-template-columns: 1fr; } }

    .listing-field {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .listing-field.full { grid-column: 1 / -1; }
    .listing-field label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .listing-field .content {
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .listing-field .char-count { font-size: 11px; color: var(--muted); }

    .btn-copy {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
      color: var(--muted);
      transition: color .15s, border-color .15s;
    }
    .btn-copy:hover { color: var(--orange); border-color: var(--orange); }
    .btn-copy.copied { color: #3a9f3a; border-color: #3a9f3a; }

    .tags-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag-chip {
      background: #fdf0e8;
      color: var(--orange-dark);
      border: 1px solid #f5d5c0;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 13px;
    }

    /* ── Mockups ── */
    .mockups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .mockup-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: box-shadow .2s;
    }
    .mockup-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,.1); }
    .mockup-card img { width: 100%; display: block; aspect-ratio: 1; object-fit: cover; }
    .mockup-card .mockup-label {
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-dl {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
      color: var(--muted);
      text-decoration: none;
      transition: color .15s, border-color .15s;
    }
    .btn-dl:hover { color: var(--orange); border-color: var(--orange); }

    /* ── Error banner ── */
    #error-banner {
      display: none;
      background: #fff0f0;
      border: 1px solid #f5c0c0;
      color: #c00;
      border-radius: var(--radius);
      padding: 14px 20px;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <span class="logo-icon">🛍️</span>
  <div>
    <h1>Etsy Listing Generator</h1>
    <p>Upload a design — get a title, description, tags, and 5 product mockups instantly</p>
  </div>
</header>

<main>

  <!-- Upload area -->
  <div class="upload-card" id="upload-card">
    <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif" />
    <div id="upload-prompt">
      <div class="upload-icon">🎨</div>
      <h2>Drop your design here</h2>
      <p>PNG, JPG, WEBP · Click or drag to upload</p>
    </div>
    <div class="preview-wrap" id="preview-wrap">
      <img id="preview-img" src="" alt="Design preview" />
      <span class="file-name" id="file-name"></span>
    </div>
  </div>

  <button class="btn-generate" id="btn-generate" disabled>Generate Listing &amp; Mockups</button>

  <div id="error-banner"></div>

  <!-- Loading -->
  <div class="spinner-wrap" id="spinner">
    <div class="spinner"></div>
    <p>Analyzing design and generating mockups — this takes about 15 seconds…</p>
  </div>

  <!-- Results -->
  <div id="results">

    <p class="section-title">Etsy Listing</p>
    <div class="listing-grid">
      <div class="listing-field full" id="field-title">
        <label>
          Title
          <span>
            <span class="char-count" id="title-chars"></span>
            <button class="btn-copy" data-target="title-content">Copy</button>
          </span>
        </label>
        <div class="content" id="title-content"></div>
      </div>

      <div class="listing-field full" id="field-desc">
        <label>
          Description
          <button class="btn-copy" data-target="desc-content">Copy</button>
        </label>
        <div class="content" id="desc-content"></div>
      </div>

      <div class="listing-field full" id="field-tags">
        <label>
          Tags <span class="char-count" id="tags-count"></span>
          <button class="btn-copy" data-target="tags-text" style="display:none" id="tags-copy-btn">Copy all</button>
        </label>
        <div class="tags-wrap" id="tags-wrap"></div>
        <span id="tags-text" style="display:none"></span>
      </div>
    </div>

    <p class="section-title">Product Mockups</p>
    <div class="mockups-grid" id="mockups-grid"></div>

  </div>
</main>

<script>
  const fileInput   = document.getElementById("file-input");
  const uploadCard  = document.getElementById("upload-card");
  const uploadPrompt= document.getElementById("upload-prompt");
  const previewWrap = document.getElementById("preview-wrap");
  const previewImg  = document.getElementById("preview-img");
  const fileNameEl  = document.getElementById("file-name");
  const btnGenerate = document.getElementById("btn-generate");
  const spinner     = document.getElementById("spinner");
  const results     = document.getElementById("results");
  const errorBanner = document.getElementById("error-banner");

  let selectedFile = null;

  function showPreview(file) {
    selectedFile = file;
    const url = URL.createObjectURL(file);
    previewImg.src = url;
    fileNameEl.textContent = file.name;
    uploadPrompt.style.display = "none";
    previewWrap.style.display = "flex";
    btnGenerate.disabled = false;
  }

  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) showPreview(fileInput.files[0]);
  });

  uploadCard.addEventListener("dragover", e => { e.preventDefault(); uploadCard.classList.add("dragover"); });
  uploadCard.addEventListener("dragleave", () => uploadCard.classList.remove("dragover"));
  uploadCard.addEventListener("drop", e => {
    e.preventDefault();
    uploadCard.classList.remove("dragover");
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith("image/")) showPreview(f);
  });

  btnGenerate.addEventListener("click", async () => {
    if (!selectedFile) return;

    errorBanner.style.display = "none";
    results.style.display = "none";
    spinner.style.display = "flex";
    btnGenerate.disabled = true;

    const fd = new FormData();
    fd.append("design", selectedFile);

    try {
      const res = await fetch("/generate", { method: "POST", body: fd });
      const data = await res.json();

      if (!res.ok || data.error) {
        throw new Error(data.error || "Server error");
      }

      renderResults(data);
    } catch (err) {
      errorBanner.textContent = "Error: " + err.message;
      errorBanner.style.display = "block";
    } finally {
      spinner.style.display = "none";
      btnGenerate.disabled = false;
    }
  });

  function renderResults({ listing, mockups }) {
    // Title
    const title = listing.title || "";
    document.getElementById("title-content").textContent = title;
    document.getElementById("title-chars").textContent = `${title.length}/140`;

    // Description
    document.getElementById("desc-content").textContent = listing.description || "";

    // Tags
    const tags = Array.isArray(listing.tags) ? listing.tags : [];
    const tagsWrap = document.getElementById("tags-wrap");
    tagsWrap.innerHTML = "";
    tags.forEach(t => {
      const chip = document.createElement("span");
      chip.className = "tag-chip";
      chip.textContent = t;
      tagsWrap.appendChild(chip);
    });
    document.getElementById("tags-count").textContent = `${tags.length}/13`;
    document.getElementById("tags-text").textContent = tags.join(", ");
    document.getElementById("tags-copy-btn").style.display = tags.length ? "" : "none";

    // Mockups
    const grid = document.getElementById("mockups-grid");
    grid.innerHTML = "";
    mockups.forEach(({ name, data }) => {
      const src = "data:image/jpeg;base64," + data;

      const card = document.createElement("div");
      card.className = "mockup-card";

      const img = document.createElement("img");
      img.src = src;
      img.alt = name + " mockup";

      const label = document.createElement("div");
      label.className = "mockup-label";
      label.textContent = name;

      const dl = document.createElement("a");
      dl.className = "btn-dl";
      dl.textContent = "Download";
      dl.href = src;
      dl.download = name.replace(/\s+/g, "-").toLowerCase() + "-mockup.jpg";

      label.appendChild(dl);
      card.appendChild(img);
      card.appendChild(label);
      grid.appendChild(card);
    });

    results.style.display = "block";
    results.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  // Copy buttons
  document.addEventListener("click", e => {
    const btn = e.target.closest(".btn-copy");
    if (!btn) return;
    const targetId = btn.dataset.target;
    const el = document.getElementById(targetId);
    if (!el) return;
    navigator.clipboard.writeText(el.textContent).then(() => {
      btn.textContent = "Copied!";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = btn.id === "tags-copy-btn" ? "Copy all" : "Copy"; btn.classList.remove("copied"); }, 2000);
    });
  });
</script>
</body>
</html>
